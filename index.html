        function triggerBasicAttack(priority) {
            if (player.state === 'DEAD' || player.attackInterval > 0) return;
            const range = player.autoAtkRange;
            let validTargets = [];
            for (let m of minions) {
                if (m.team === 'enemy' && m.hp > 0) {
                    const d = Math.hypot(m.x - player.x, m.y - player.y);
                    if (d <= range + m.radius) validTargets.push({ entity: m, type: 'minion', dist: d });
                }
            }
            if (bot.state !== 'DEAD' && bot.hp > 0) {
                const d = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (d <= range + bot.radius) validTargets.push({ entity: bot, type: 'hero', dist: d });
            }
            for (let t of structures) {
                if (t.team === 'enemy' && t.hp > 0) {
                    const d = Math.hypot(t.x - player.x, t.y - player.y);
                    if (d <= range + t.radius) validTargets.push({ entity: t, type: 'tower', dist: d });
                }
            }
            if (validTargets.length === 0) return;
            validTargets.sort((a, b) => {
                let scoreA = 99, scoreB = 99;
                if (priority === 'all') {
                    if (a.type === 'hero') scoreA = 1; else if (a.type === 'minion') scoreA = 2; else scoreA = 3;
                    if (b.type === 'hero') scoreB = 1; else if (b.type === 'minion') scoreB = 2; else scoreB = 3;
                } else if (priority === 'minion') {
                    if (a.type === 'minion') scoreA = 1; else if (a.type === 'hero') scoreA = 2; else scoreA = 3;
                    if (b.type === 'minion') scoreB = 1; else if (b.type === 'hero') scoreB = 2; else scoreB = 3;
                } else if (priority === 'tower') {
                    if (a.type === 'tower') scoreA = 1; else if (a.type === 'hero') scoreA = 2; else scoreA = 3;
                    if (b.type === 'tower') scoreB = 1; else if (b.type === 'hero') scoreB = 2; else scoreB = 3;
                }
                return scoreA !== scoreB ? scoreA - scoreB : a.dist - b.dist;
            });
            let target = validTargets[0].entity;
            player.angle = Math.atan2(target.y - player.y, target.x - player.x);
            player.attackFacingTimer = 180; player.attackStunTimer = 30;
            player.recallTimer = 0;
            player.homeguardTimer = 0;
            if (target === bot) {
                structures.forEach(s => {
                    if (s.team === 'enemy' && s.hp > 0 && Math.hypot(player.x - s.x, player.y - s.y) <= s.range) s.currentTarget = player;
                });
            }
            player.attackInterval = 380;
            let offY = (validTargets[0].type === 'tower') ? -20 : 0;

            const isEmpowered = player.empoweredAtks > 0 && player.empoweredTimer > 0;
            const dmgMult = isEmpowered ? 1.8 : 1.0;
            if (isEmpowered) player.empoweredAtks -= 1;

            basicAtkTracers.push({ target: target, offsetY: offY, duration: 140, empowered: isEmpowered });
            dealDamage(target, player.basicAtkDmg * dmgMult, 'player', true);
        }

        function consumeS3Charge() {
            if (cooldowns.s3.charges <= 0) return;
            if (cooldowns.s3.charges === cooldowns.s3.maxCharges) cooldowns.s3.rechargeTimer = cooldowns.s3.rechargeMax;
            cooldowns.s3.charges -= 1;
            if (cooldowns.s3.charges > 0) cooldowns.s3.current = cooldowns.s3.recastMax;
            else cooldowns.s3.current = cooldowns.s3.rechargeTimer;
        }

        function fireS3Projectile(targetAngle, dynamicMaxDist, chargePct) {
            const spawnDist = player.radius + 42;
            projectiles.push({
                x: player.x + Math.cos(targetAngle) * spawnDist, y: player.y + Math.sin(targetAngle) * spawnDist,
                dx: Math.cos(targetAngle) * 30, dy: Math.sin(targetAngle) * 30,
                distTraveled: 0, maxDist: dynamicMaxDist, radius: 6,
                isSniper: true, angle: targetAngle, hitEntities: [],
                chargePct: chargePct
            });
            consumeS3Charge();
            camera.zoomHoldTimer = 800;
            player.empoweredAtks = 2;
            player.empoweredTimer = 5000;
        }

        function resolveSkillRelease() {
            const skill = activeAim.skillId, isCanceled = activeAim.isCanceled;
            document.getElementById('cancelZone').classList.remove('active', 'hovered');
            activeAim.skillId = null; activeAim.touchId = null;
            if (isCanceled) {
                if (skill === 's3') { consumeS3Charge(); camera.zoomHoldTimer = 500; }
                return;
            }
            player.recallTimer = 0;
            player.homeguardTimer = 0;
            if (skill === 's2') {
                let targetX, targetY;
                if (!activeAim.hasMoved || activeAim.dragDist < 0.25) {
                    const smart = getSmartTargetCoords(cooldowns.s2.range); targetX = smart.x; targetY = smart.y;
                } else {
                    const castDist = activeAim.dragDist * cooldowns.s2.range;
                    targetX = player.x + Math.cos(activeAim.angle) * castDist; targetY = player.y + Math.sin(activeAim.angle) * castDist;
                }
                player.angle = Math.atan2(targetY - player.y, targetX - player.x);
                player.attackFacingTimer = 180; player.attackStunTimer = 30;
                beamTracers.push({ targetX: targetX, targetY: targetY, duration: 220 });
                slowFields.push({ x: targetX, y: targetY, radius: 115, duration: cooldowns.s2.activeDur });
                cooldowns.s2.current = cooldowns.s2.max;
            } else if (skill === 's3') {
                const chargePct = Math.min(1.0, activeAim.chargeTime / cooldowns.s3.chargeDur);
                fireS3Projectile(activeAim.angle, 400 + (chargePct * 700), chargePct);
            }
        }

        function initSkillAim(skillId, touchEvent) {
            if (player.state === 'DEAD') return;
            if (player.skillRanks[skillId] <= 0) return;
            if (skillId === 's3') {
                if (cooldowns.s3.charges <= 0 || cooldowns.s3.current > 0) return;
            } else if (cooldowns[skillId].current > 0) return;
            player.recallTimer = 0;
            player.homeguardTimer = 0;
            const touch = touchEvent.changedTouches[0];
            activeAim.skillId = skillId; activeAim.touchId = touch.identifier;
            activeAim.startX = touch.clientX; activeAim.startY = touch.clientY;
            activeAim.currentX = touch.clientX; activeAim.currentY = touch.clientY;
            activeAim.dragDist = 0; activeAim.chargeTime = 0; activeAim.fullZoomHoldTime = 0;
            activeAim.isCanceled = false; activeAim.hasMoved = false;
            const smart = getSmartTargetCoords(skillId === 's2' ? cooldowns.s2.range : 1100);
            activeAim.angle = smart.angle;
            if (skillId === 's3') player.angle = activeAim.angle;
            document.getElementById('cancelZone').classList.add('active');
        }

        function findMinionTarget(m) {
            const aggroRange = 240;
            let best = null, bestDist = Infinity;
            for (let o of minions) {
                if (o === m || o.team === m.team || o.hp <= 0) continue;
                const d = Math.hypot(o.x - m.x, o.y - m.y);
                if (d <= aggroRange && d < bestDist) { best = o; bestDist = d; }
            }
            if (m.team === 'enemy' && player.hp > 0 && !player.isInvincible && player.state !== 'DEAD') {
                const d = Math.hypot(player.x - m.x, player.y - m.y);
                if (d <= aggroRange && d < bestDist) { best = player; bestDist = d; }
            }
            if (m.team === 'ally' && bot.state !== 'DEAD' && bot.hp > 0) {
                const d = Math.hypot(bot.x - m.x, bot.y - m.y);
                if (d <= aggroRange && d < bestDist) { best = bot; bestDist = d; }
            }
            for (let t of structures) {
                if (t.team === m.team || t.hp <= 0) continue;
                const d = Math.hypot(t.x - m.x, t.y - m.y);
                if (d <= aggroRange + t.radius && d < bestDist) { best = t; bestDist = d; }
            }
            return best;
        }

        function separateMinions() {
            for (let i = 0; i < minions.length; i++) {
                for (let j = i + 1; j < minions.length; j++) {
                    let m1 = minions[i], m2 = minions[j];
                    if (m1.hp <= 0 || m2.hp <= 0) continue;
                    let dx = m1.x - m2.x, dy = m1.y - m2.y;
                    let dist = Math.hypot(dx, dy), minDist = m1.radius + m2.radius;
                    if (dist > 0 && dist < minDist) {
                        let push = (minDist - dist) * 0.15;
                        let pushX = (dx / dist) * push, pushY = (dy / dist) * push;
                        m1.x += pushX; m1.y += pushY; m2.x -= pushX; m2.y -= pushY;
                    }
                }
            }
            for (let m of minions) ejectFromWall(m);
        }

        function updateMinions(dt) {
            const ff = dt / 16.67;
            for (let m of minions) {
                if (m.hp <= 0) continue;
                if (m.spawnAlpha < 1) m.spawnAlpha = Math.min(1, m.spawnAlpha + dt / 500);
                if (m.attackCd > 0) m.attackCd -= dt;
                const target = findMinionTarget(m);
                if (target) {
                    const d = Math.hypot(target.x - m.x, target.y - m.y);
                    const reach = m.attackRange + target.radius;
                    if (d > reach) {
                        const angle = Math.atan2(target.y - m.y, target.x - m.x);
                        const stepX = Math.cos(angle) * m.speed * ff, stepY = Math.sin(angle) * m.speed * ff;
                        const movedX = canMoveTo(m.x + stepX, m.y, m.radius, false);
                        const movedY = canMoveTo(m.x, m.y + stepY, m.radius, false);
                        if (movedX) m.x += stepX;
                        if (movedY) m.y += stepY;
                        if (!movedX && movedY) {
                            const slideY = (stepY >= 0 ? 1 : -1) * m.speed * ff * 0.6;
                            if (canMoveTo(m.x, m.y + slideY, m.radius, false)) m.y += slideY;
                        } else if (movedX && !movedY) {
                            const slideX = (stepX >= 0 ? 1 : -1) * m.speed * ff * 0.6;
                            if (canMoveTo(m.x + slideX, m.y, m.radius, false)) m.x += slideX;
                        }
                    } else if (m.attackCd <= 0) {
                        const src = m.team === 'ally' ? 'ally_minion' : 'enemy_minion';
                        dealDamage(target, m.dmg, src, false);
                        m.attackCd = m.attackInterval;
                    }
                } else {
                    let closestIdx = m.waypointIdx, minDist = Infinity;
                    for (let i = Math.max(0, m.waypointIdx - 5); i < Math.min(m.path.length, m.waypointIdx + 20); i++) {
                        let d = Math.hypot(m.path[i].x - m.x, m.path[i].y - m.y);
                        if (d < minDist) { minDist = d; closestIdx = i; }
                    }
                    if (closestIdx > m.waypointIdx) m.waypointIdx = closestIdx;
                    let targetIdx = Math.min(m.path.length - 1, m.waypointIdx);
                    let targetNode = m.path[targetIdx];
                    if (!targetNode) targetNode = m.team === 'ally' ? enemyNexus : allyNexus;
                    const d = Math.hypot(targetNode.x - m.x, targetNode.y - m.y);
                    if (d < 25) {
                        if (m.waypointIdx < m.path.length - 1) m.waypointIdx++;
                    } else {
                        const angle = Math.atan2(targetNode.y - m.y, targetNode.x - m.x);
                        const stepX = Math.cos(angle) * m.speed * ff, stepY = Math.sin(angle) * m.speed * ff;
                        const movedX = canMoveTo(m.x + stepX, m.y, m.radius, false);
                        const movedY = canMoveTo(m.x, m.y + stepY, m.radius, false);
                        if (movedX) m.x += stepX;
                        if (movedY) m.y += stepY;
                        if (!movedX && movedY) {
                            const slideY = (stepY >= 0 ? 1 : -1) * m.speed * ff * 0.6;
                            if (canMoveTo(m.x, m.y + slideY, m.radius, false)) m.y += slideY;
                        } else if (movedX && !movedY) {
                            const slideX = (stepX >= 0 ? 1 : -1) * m.speed * ff * 0.6;
                            if (canMoveTo(m.x + slideX, m.y, m.radius, false)) m.x += slideX;
                        }
                    }
                }
            }
            separateMinions();
            for (let i = minions.length - 1; i >= 0; i--) {
                const m = minions[i];
                if (m.hp <= 0) {
                    if (m.team === 'enemy') {
                        const dP = Math.hypot(player.x - m.x, player.y - m.y);
                        if (dP <= 450) {
                            grantXP(player, 35);
                            grantGold(player, m.lastDamagedBy === 'player' ? 40 : 22);
                        }
                    } else if (m.team === 'ally') {
                        const dB = Math.hypot(bot.x - m.x, bot.y - m.y);
                        if (dB <= 450) {
                            grantXP(bot, 35);
                            grantGold(bot, m.lastDamagedBy === 'bot' ? 40 : 22);
                        }
                    }
                    minions.splice(i, 1);
                }
            }
        }

        function updateLane(dt) {
            laneManager.waveTimer -= dt;
            if (laneManager.waveTimer <= 0) { spawnMinionWave(); laneManager.waveTimer = laneManager.waveInterval; }
            processSpawnQueue(dt);
            updateMinions(dt);
        }

        function updateTowers(dt) {
            for (let t of structures) {
                if (t.hp <= 0) continue;
                if (t.currentTarget) {
                    const d = Math.hypot(t.currentTarget.x - t.x, t.currentTarget.y - t.y);
                    if (t.currentTarget === player && (player.isInvincible || player.state === 'DEAD')) t.currentTarget = null;
                    else if (t.currentTarget === bot && bot.state === 'DEAD') t.currentTarget = null;
                    else if (t.currentTarget.hp <= 0) t.currentTarget = null;
                    else if (t.currentTarget !== player && t.currentTarget !== bot) {
                        if (d > t.range + 100) t.currentTarget = null;
                    } else {
                        const targetRadius = t.currentTarget === player ? player.radius : bot.radius;
                        if (d > t.range + targetRadius) t.currentTarget = null;
                    }
                }
                if (!t.currentTarget) {
                    let bestMinion = null, minDist = Infinity;
                    for (let m of minions) {
                        if (m.team !== t.team && m.hp > 0) {
                            const d = Math.hypot(m.x - t.x, m.y - t.y);
                            if (d <= t.range + m.radius && d < minDist) { bestMinion = m; minDist = d; }
                        }
                    }
                    if (bestMinion) t.currentTarget = bestMinion;
                    else {
                        if (t.team === 'enemy' && player.hp > 0 && !player.isInvincible && player.state !== 'DEAD') {
                            const d = Math.hypot(player.x - t.x, player.y - t.y);
                            if (d <= t.range + player.radius) t.currentTarget = player;
                        }
                        if (t.team === 'ally' && bot.state !== 'DEAD' && bot.hp > 0) {
                            const d = Math.hypot(bot.x - t.x, bot.y - t.y);
                            if (d <= t.range + bot.radius) t.currentTarget = bot;
                        }
                    }
                }
                if (t.fireCooldown > 0) t.fireCooldown -= dt;
                if (t.fireCooldown <= 0 && t.currentTarget) {
                    towerShots.push({ x: t.x, y: t.y - 20, speed: 6.5, radius: 9, team: t.team, target: t.currentTarget, dmg: 30 });
                    t.fireCooldown = t.fireRate;
                }
            }
            const ff = dt / 16.67;
            for (let i = towerShots.length - 1; i >= 0; i--) {
                const s = towerShots[i];
                if (!s.target || s.target.hp <= 0) { towerShots.splice(i, 1); continue; }
                if (s.target === bot && bot.state === 'DEAD') { towerShots.splice(i, 1); continue; }
                if (s.target === player && player.state === 'DEAD') { towerShots.splice(i, 1); continue; }
                const angle = Math.atan2(s.target.y - s.y, s.target.x - s.x);
                s.x += Math.cos(angle) * s.speed * ff; s.y += Math.sin(angle) * s.speed * ff;
                if (Math.hypot(s.target.x - s.x, s.target.y - s.y) < s.target.radius + s.radius) {
                    const src = s.team === 'ally' ? 'ally_tower' : 'enemy_tower';
                    dealDamage(s.target, s.dmg, src, s.target === player);
                    towerShots.splice(i, 1);
                }
            }
        }

        function rotateBotToward(targetAngle, turnSpeed) {
            let diff = targetAngle - bot.angle;
            while (diff < -Math.PI) diff += Math.PI * 2;
            while (diff > Math.PI) diff -= Math.PI * 2;
            bot.angle += diff * Math.min(1, turnSpeed);
        }

        function moveBotToward(tx, ty, spd, updateFacing = true, ignoreStun = false) {
            if (!ignoreStun && bot.attackStunTimer > 0) return;
            const dist = Math.hypot(tx - bot.x, ty - bot.y);
            if (dist < 4) return;
            const moveAng = Math.atan2(ty - bot.y, tx - bot.x);
            if (updateFacing) rotateBotToward(moveAng, 0.22);
            const sx = Math.cos(moveAng) * spd, sy = Math.sin(moveAng) * spd;
            if (canMoveTo(bot.x + sx, bot.y, bot.radius, false)) bot.x += sx;
            if (canMoveTo(bot.x, bot.y + sy, bot.radius, false)) bot.y += sy;
        }

        function isBotSafeToRecall() {
            if (player.state !== 'DEAD' && player.hp > 0) {
                if (Math.hypot(player.x - bot.x, player.y - bot.y) < 600) return false;
            }
            for (let m of minions) {
                if (m.team === 'ally' && m.hp > 0 && Math.hypot(m.x - bot.x, m.y - bot.y) < 400) return false;
            }
            for (let s of structures) {
                if (s.team === 'ally' && s.hp > 0 && s.currentTarget === bot) return false;
            }
            for (let f of slowFields) {
                if (Math.hypot(bot.x - f.x, bot.y - f.y) < f.radius + bot.radius) return false;
            }
            return true;
        }

        function updateBot(dt) {
            const botUI = document.getElementById('botStateText');
            if (bot.hp <= 0) {
                if (bot.state !== 'DEAD') {
                    if (bot.lastDamagedBy === 'player') {
                        player.kills += 1;
                        grantXP(player, 180);
                        grantGold(player, 200);
                        spawnFloatingText(bot.x, bot.y - 90, 'KILL!', '#ffd54f', 22);
                    }
                    bot.deaths += 1;
                    bot.state = 'DEAD'; bot.respawnTimer = 6000;
                    bot.isRecalling = false; bot.recallProgress = 0;
                    visualExplosions.push({ x: bot.x, y: bot.y, radius: 65, duration: 300 });
                }
                bot.respawnTimer -= dt;
                botUI.innerText = `AI: DEAD ${Math.ceil(bot.respawnTimer / 1000)}s`;
                if (bot.respawnTimer <= 0) {
                    bot.hp = bot.maxHp; bot.x = 1920; bot.y = 480;
                    bot.state = 'PUSHING'; bot.waypointIdx = 0; bot.isSlowed = false;
                    bot.isRecalling = false; bot.recallProgress = 0; bot.damageRecoilTimer = 0;
                    bot.lastDamagedBy = null;
                }
                return;
            }
            if (bot.isSlowed && (bot.slowTimer -= dt) <= 0) bot.isSlowed = false;
            if (bot.attackCd > 0) bot.attackCd -= dt;
            if (bot.skillCd > 0) bot.skillCd -= dt;
            if (bot.attackStunTimer > 0) bot.attackStunTimer -= dt;
            if (bot.damageRecoilTimer > 0) bot.damageRecoilTimer -= dt;
            if (bot.homeguardTimer > 0) bot.homeguardTimer -= dt;

            if (Math.hypot(bot.x - enemyNexus.x, bot.y - enemyNexus.y) <= 220) bot.homeguardTimer = 4000;

            const frameFactor = dt / 16.67;
            const hgMult = 1 + 0.55 * (Math.max(0, bot.homeguardTimer) / 4000);
            const spd = (bot.isSlowed ? bot.baseSpeed * 0.55 : bot.baseSpeed) * hgMult * frameFactor;
            const isEarlyGame = bot.level <= 3;

            if (bot.isRecalling) {
                if (!isBotSafeToRecall() || bot.damageRecoilTimer > 0) {
                    bot.isRecalling = false; bot.recallProgress = 0;
                    botUI.innerText = 'AI: RECALL INTERRUPTED';
                } else {
                    bot.recallProgress += dt;
                    botUI.innerText = `AI: RECALL ${Math.ceil((bot.recallDuration - bot.recallProgress) / 1000)}s`;
                    if (bot.recallProgress >= bot.recallDuration) {
                        bot.x = 1920; bot.y = 480;
                        bot.isRecalling = false; bot.recallProgress = 0;
                        bot.state = 'RETREATING';
                        bot.waypointIdx = 0;
                        visualExplosions.push({ x: bot.x, y: bot.y, radius: 50, duration: 300 });
                    }
                    return;
                }
            }

            if (bot.state === 'RETREATING' && bot.hp < bot.maxHp * 0.4) {
                const dHome = Math.hypot(1920 - bot.x, 480 - bot.y);
                if (dHome > 700 && isBotSafeToRecall()) {
                    bot.isRecalling = true; bot.recallProgress = 0;
                    return;
                }
            }

            const towerTargetingBot = structures.some(s => s.team === 'ally' && s.hp > 0 && s.currentTarget === bot);
            const retreatThreshold = isEarlyGame ? 0.4 : 0.25;
            if (bot.hp < bot.maxHp * retreatThreshold) bot.state = 'RETREATING';
            else if (bot.state === 'RETREATING' && bot.hp >= bot.maxHp * 0.85 && !towerTargetingBot) bot.state = 'PUSHING';

            if (towerTargetingBot) {
                botUI.innerText = 'AI: FALLBACK';
                moveBotToward(1920, 480, spd, true, true);
                return;
            }

            let inSlowField = false;
            for (let f of slowFields) {
                const dPool = Math.hypot(bot.x - f.x, bot.y - f.y);
                if (dPool < f.radius + bot.radius + 15) {
                    inSlowField = true;
                    let ex = bot.x - f.x;
                    let ey = bot.y - f.y;
                    const em = Math.hypot(ex, ey);
                    const hx = 1920 - bot.x, hy = 480 - bot.y;
                    const hm = Math.hypot(hx, hy) || 1;
                    if (em < 15) {
                        ex = hx / hm; ey = hy / hm;
                    } else {
                        ex = (ex / em) * 0.6 + (hx / hm) * 0.4;
                        ey = (ey / em) * 0.6 + (hy / hm) * 0.4;
                    }
                    moveBotToward(bot.x + ex * 80, bot.y + ey * 80, spd, true, false);
                    break;
                }
            }

            if (bot.state === 'RETREATING') {
                const dHome = Math.hypot(1920 - bot.x, 480 - bot.y);
                if (dHome > 45) {
                    if (!inSlowField) moveBotToward(1920, 480, spd, true, false);
                    botUI.innerText = 'AI: RETREAT';
                } else {
                    bot.hp = Math.min(bot.maxHp, bot.hp + 0.35 * dt);
                    botUI.innerText = 'AI: HEAL';
                }
                return;
            }

            let underUntankedAllyTower = false;
            if (isEarlyGame) {
                for (let s of structures) {
                    if (s.team === 'ally' && s.hp > 0 && Math.hypot(bot.x - s.x, bot.y - s.y) <= s.range + 40) {
                        underUntankedAllyTower = true; break;
                    }
                }
            } else {
                for (let s of structures) {
                    if (s.team === 'ally' && s.hp > 0 && Math.hypot(bot.x - s.x, bot.y - s.y) <= s.range + 20) {
                        const tanking = minions.some(m => m.team === 'enemy' && m.hp > 0 && Math.hypot(m.x - s.x, m.y - s.y) <= s.range);
                        if (!tanking) { underUntankedAllyTower = true; break; }
                    }
                }
            }

            let target = null, bestDist = Infinity;
            if (player.hp > 0 && !player.isInvincible && player.state !== 'DEAD' && !underUntankedAllyTower) {
                const dP = Math.hypot(player.x - bot.x, player.y - bot.y);
                if (dP <= bot.autoAtkRange + 35) { target = player; bestDist = dP; }
            }
            if (!target) {
                for (let m of minions) {
                    if (m.team === 'ally' && m.hp > 0) {
                        const d = Math.hypot(m.x - bot.x, m.y - bot.y);
                        if (d <= bot.autoAtkRange + 20 && d < bestDist) { target = m; bestDist = d; }
                    }
                }
            }
            if (!target && !underUntankedAllyTower) {
                for (let st of structures) {
                    if (st.team === 'ally' && st.hp > 0) {
                        const d = Math.hypot(st.x - bot.x, st.y - bot.y);
                        const tanking = minions.some(m => m.team === 'enemy' && m.hp > 0 && Math.hypot(m.x - st.x, m.y - st.y) <= st.range);
                        if (d <= bot.autoAtkRange + st.radius && tanking) { target = st; bestDist = d; break; }
                    }
                }
            }

            if (target) {
                bot.state = 'ATTACKING'; botUI.innerText = 'AI: ATTACK';
                const d = Math.hypot(target.x - bot.x, target.y - bot.y);
                const aimAngle = Math.atan2(target.y - bot.y, target.x - bot.x);
                rotateBotToward(aimAngle, 0.3);

                if (target === player) {
                    const preferred = 200;
                    if (d < preferred - 30 && !inSlowField) {
                        moveBotToward(bot.x + (bot.x - player.x), bot.y + (bot.y - player.y), spd * 0.9, false, false);
                    } else if (d > bot.autoAtkRange + player.radius - 20 && !inSlowField) {
                        moveBotToward(target.x, target.y, spd * 0.85, false, false);
                    }
                } else if (d > bot.autoAtkRange + (target.radius || 0) - 15 && !inSlowField) {
                    moveBotToward(target.x, target.y, spd * 0.85, false, false);
                }

                if (target === player && bot.skillCd <= 0 && !player.isInvincible) {
                    bot.angle = aimAngle; bot.attackStunTimer = 160;
                    bot.homeguardTimer = 0;
                    botProjectiles.push({ x: bot.x, y: bot.y, dx: Math.cos(aimAngle) * 10, dy: Math.sin(aimAngle) * 10, radius: 10, dist: 0, maxDist: 500, dmg: getBotSkillDamage() });
                    bot.skillCd = bot.skillMaxCd;
                }

                if (d <= bot.autoAtkRange + (target.radius || 0) && bot.attackCd <= 0) {
                    bot.attackStunTimer = 120;
                    bot.homeguardTimer = 0;
                    botAtkTracers.push({ x1: bot.x, y1: bot.y, x2: target.x, y2: target.y, duration: 130 });
                    dealDamage(target, bot.basicAtkDmg, 'bot', target === player);
                    if (target === player) {
                        for (let s of structures) {
                            if (s.team === 'ally' && s.hp > 0 && Math.hypot(bot.x - s.x, bot.y - s.y) <= s.range) s.currentTarget = bot;
                        }
                    }
                    bot.attackCd = bot.attackInterval;
                }
            } else {
                bot.state = 'PUSHING'; botUI.innerText = 'AI: PUSH';
                for (let st of structures) {
                    if (st.team === 'ally' && st.hp > 0) {
                        const dSt = Math.hypot(st.x - bot.x, st.y - bot.y);
                        const tanking = minions.some(m => m.team === 'enemy' && m.hp > 0 && Math.hypot(m.x - st.x, m.y - st.y) <= st.range);
                        if (dSt <= st.range + 55 && !tanking) {
                            if (dSt < st.range + 25 && !inSlowField) moveBotToward(1920, 480, spd * 0.8, true, true);
                            return;
                        }
                    }
                }
                if (!inSlowField) {
                    const path = laneManager.enemyMidPath;
                    let closest = bot.waypointIdx, minD = Infinity;
                    for (let i = 0; i < path.length; i++) {
                        const d = Math.hypot(path[i].x - bot.x, path[i].y - bot.y);
                        if (d < minD) { minD = d; closest = i; }
                    }
                    bot.waypointIdx = Math.min(path.length - 1, closest + 2);
                    const node = path[bot.waypointIdx];
                    if (Math.hypot(node.x - bot.x, node.y - bot.y) > 24) moveBotToward(node.x, node.y, spd * 0.75, true, false);
                }
            }
        }

        function checkGameOver() {
            if (gameOver) return;
            if (enemyNexus.hp <= 0) {
                gameOver = true;
                const el = document.getElementById('gameOverOverlay'), txt = document.getElementById('gameOverText');
                txt.innerText = 'VICTORY'; txt.className = 'victory'; el.classList.add('active');
            } else if (allyNexus.hp <= 0) {
                gameOver = true;
                const el = document.getElementById('gameOverOverlay'), txt = document.getElementById('gameOverText');
                txt.innerText = 'DEFEAT'; txt.className = 'defeat'; el.classList.add('active');
            }
        }

        function updateHUD() {
            const floorGold = Math.floor(player.gold);
            if (floorGold !== lastHudGold) {
                lastHudGold = floorGold;
                document.getElementById('goldDisplay').innerText = `💰 ${floorGold}`;
            }
            if (player.level !== lastHudLevel) {
                lastHudLevel = player.level;
                document.getElementById('lvlDisplay').innerText = player.level >= 12 ? 'Lv. 12 MAX' : `Lv. ${player.level}`;
            }
            if (player.kills !== lastHudPlayerKills) {
                lastHudPlayerKills = player.kills;
                document.getElementById('allyKills').innerText = player.kills;
            }
            if (bot.kills !== lastHudBotKills) {
                lastHudBotKills = bot.kills;
                document.getElementById('enemyKills').innerText = bot.kills;
            }
            if (player.level >= 12) {
                if (lastHudXpPct !== 100) {
                    lastHudXpPct = 100;
                    document.getElementById('xpBar').style.width = '100%';
                    document.getElementById('xpBar').style.background = 'linear-gradient(90deg, #ffd54f, #ff8f00)';
                }
            } else {
                const pct = Math.round((player.xp / player.xpToNext) * 100);
                if (pct !== lastHudXpPct) {
                    lastHudXpPct = pct;
                    document.getElementById('xpBar').style.width = `${pct}%`;
                    document.getElementById('xpBar').style.background = 'linear-gradient(90deg, #45f3ff, #00ff66)';
                }
            }
            const atkBtn = document.getElementById('atkBtn');
            if (player.empoweredAtks > 0 && player.empoweredTimer > 0) {
                atkBtn.style.boxShadow = '0 0 22px rgba(255,213,79,0.9), 0 0 12px rgba(69,243,255,0.7)';
                atkBtn.style.borderColor = '#ffd54f';
            } else {
                atkBtn.style.boxShadow = '';
                atkBtn.style.borderColor = '';
            }
            if (!gameOver) {
                const sec = Math.floor((performance.now() - matchStartTime) / 1000);
                if (sec !== lastTimerSecond) {
                    lastTimerSecond = sec;
                    document.getElementById('matchTimer').innerText = formatTime(sec);
                }
            }
        }

        function update(deltaTime) {
            if (gameOver) return;
            const dtSec = deltaTime / 1000;

            if (player.state !== 'DEAD') {
                player.gold += 2 * dtSec;
                grantXP(player, 1.5 * dtSec, false);
            }
            if (bot.state !== 'DEAD') {
                bot.gold += 2 * dtSec;
                grantXP(bot, 1.5 * dtSec, false);
            }

            if (player.empoweredTimer > 0) {
                player.empoweredTimer -= deltaTime;
                if (player.empoweredTimer <= 0) player.empoweredAtks = 0;
            }
            if (player.homeguardTimer > 0) player.homeguardTimer -= deltaTime;
            if (player.state === 'ALIVE' && Math.hypot(player.x - allyNexus.x, player.y - allyNexus.y) <= 220) {
                player.homeguardTimer = 4000;
            }

            if (player.state === 'DEAD') {
                player.respawnTimer -= deltaTime;
                if (player.respawnTimer <= 0) {
                    player.state = 'ALIVE'; player.hp = player.maxHp;
                    player.x = allyNexus.x; player.y = allyNexus.y;
                    player.recallTimer = 0; player.dx = 0; player.dy = 0;
                    player.isInvincible = false; player.passiveActive = false;
                    player.speed = player.baseSpeed;
                    player.attackStunTimer = 0; player.attackInterval = 0; player.attackFacingTimer = 0;
                    player.lastDamagedBy = null;
                    cooldowns.s1.current = 0;
                    cooldowns.s2.current = 0;
                    cooldowns.s3.current = 0;
                    cooldowns.s3.charges = cooldowns.s3.maxCharges;
                    cooldowns.s3.rechargeTimer = 0;
                    camera.offsetX = 0; camera.offsetY = 0;
                }
            } else {
                if (player.recallTimer > 0) {
                    player.recallTimer -= deltaTime;
                    if (player.recallTimer <= 0) {
                        player.x = allyNexus.x; player.y = allyNexus.y;
                        player.recallTimer = 0; camera.offsetX = 0; camera.offsetY = 0;
                    }
                }
                if (player.hp > 0 && player.hp < player.maxHp && Math.hypot(player.x - allyNexus.x, player.y - allyNexus.y) <= 220) {
                    player.hp = Math.min(player.maxHp, player.hp + 0.35 * deltaTime);
                }
                if (player.attackFacingTimer > 0) player.attackFacingTimer -= deltaTime;
                if (activeAim.skillId === 's3') {
                    if (activeAim.chargeTime < cooldowns.s3.chargeDur) activeAim.chargeTime += deltaTime;
                    else {
                        activeAim.fullZoomHoldTime += deltaTime;
                        if (activeAim.fullZoomHoldTime >= cooldowns.s3.maxChargeHoldLimit) { activeAim.isCanceled = false; resolveSkillRelease(); }
                    }
                }
                if (!joyActive) {
                    let kx = 0, ky = 0;
                    if (keys['w']) ky -= 1;
                    if (keys['s']) ky += 1;
                    if (keys['a']) kx -= 1;
                    if (keys['d']) kx += 1;
                    if (kx !== 0 || ky !== 0) {
                        const kAngle = Math.atan2(ky, kx);
                        if (activeAim.skillId !== 's3' && player.attackFacingTimer <= 0) player.angle = kAngle;
                        player.dx = Math.cos(kAngle); player.dy = Math.sin(kAngle);
                        if (player.recallTimer > 0) player.recallTimer = 0;
                    } else { player.dx = 0; player.dy = 0; }
                }
                if (player.attackInterval > 0) player.attackInterval -= deltaTime;
                if (player.attackStunTimer > 0) player.attackStunTimer -= deltaTime;
                if (player.isInvincible) { player.invincibleTimer -= deltaTime; if (player.invincibleTimer <= 0) player.isInvincible = false; }
                if (player.passiveActive) {
                    player.passiveTimer -= deltaTime;
                    if (player.passiveTimer <= 0) {
                        player.passiveActive = false; player.speed = player.baseSpeed; ejectFromWall(player);
                    }
                }
                if (player.attackStunTimer <= 0) {
                    const ultSlow = (activeAim.skillId === 's3') ? 0.65 : 1.0;
                    const hgMult = 1 + 0.55 * (Math.max(0, player.homeguardTimer) / 4000);
                    const currentSpeed = player.speed * ultSlow * hgMult;
                    const ff = deltaTime / 16.67;
                    const stepX = player.dx * currentSpeed * ff, stepY = player.dy * currentSpeed * ff;
                    let moved = false;
                    if (canMoveTo(player.x + stepX, player.y, player.radius, player.passiveActive)) { player.x += stepX; if (Math.abs(stepX) > 0.01) moved = true; }
                    if (canMoveTo(player.x, player.y + stepY, player.radius, player.passiveActive)) { player.y += stepY; if (Math.abs(stepY) > 0.01) moved = true; }
                    if (moved && player.recallTimer > 0) player.recallTimer = 0;
                }
            }

            ['s1', 's2'].forEach(key => {
                if (cooldowns[key].current > 0) {
                    cooldowns[key].current = Math.max(0, cooldowns[key].current - deltaTime);
                    document.getElementById(`${key}CD`).style.height = `${(cooldowns[key].current / cooldowns[key].max) * 100}%`;
                } else document.getElementById(`${key}CD`).style.height = '0%';
            });

            const s3 = cooldowns.s3;
            if (s3.current > 0) s3.current = Math.max(0, s3.current - deltaTime);
            if (player.skillRanks.s3 <= 0) {
                document.getElementById('s3Btn').style.opacity = '0.4';
                document.getElementById('s3Btn').style.filter = 'grayscale(100%)';
                document.getElementById('s3AmmoBadge').innerText = 'L4';
                document.getElementById('s3AmmoBadge').style.background = '#666';
                document.getElementById('s3CD').style.height = '100%';
                document.getElementById('s3RechargeBar').style.width = '0%';
            } else {
                document.getElementById('s3Btn').style.opacity = '1';
                document.getElementById('s3Btn').style.filter = 'none';
                if (s3.charges < s3.maxCharges) {
                    s3.rechargeTimer -= deltaTime;
                    if (s3.rechargeTimer <= 0) { s3.charges += 1; s3.rechargeTimer = (s3.charges < s3.maxCharges) ? s3.rechargeMax : 0; }
                    document.getElementById('s3RechargeBar').style.width = `${((s3.rechargeMax - s3.rechargeTimer) / s3.rechargeMax) * 100}%`;
                } else {
                    document.getElementById('s3RechargeBar').style.width = '0%';
                }
                document.getElementById('s3AmmoBadge').innerText = s3.charges;
                document.getElementById('s3AmmoBadge').style.background = s3.charges > 0 ? '#ffc107' : '#e94560';
                if (s3.charges === 0 && s3.rechargeTimer > 0) {
                    document.getElementById('s3CD').style.height = `${(s3.rechargeTimer / s3.rechargeMax) * 100}%`;
                } else if (s3.current > 0) {
                    document.getElementById('s3CD').style.height = `${(s3.current / s3.recastMax) * 100}%`;
                } else {
                    document.getElementById('s3CD').style.height = '0%';
                }
            }

            let targetZoom = 1.0;
            if (activeAim.skillId === 's3') targetZoom = 1.0 - (Math.min(1.0, activeAim.chargeTime / cooldowns.s3.chargeDur) * 0.28);
            else if (camera.zoomHoldTimer > 0) { camera.zoomHoldTimer -= deltaTime; targetZoom = 1.0 - (0.28 * Math.min(1, camera.zoomHoldTimer / 500)); }
            camera.zoom += (targetZoom - camera.zoom) * 0.22;

            if (!camera.isPanning && !camera.minimapJumpActive && player.state !== 'DEAD') {
                camera.offsetX *= 0.85;
                camera.offsetY *= 0.85;
                if (Math.abs(camera.offsetX) < 0.3) camera.offsetX = 0;
                if (Math.abs(camera.offsetY) < 0.3) camera.offsetY = 0;
            }
            let focusX = player.x, focusY = player.y;
            if (camera.minimapJumpActive) { focusX = camera.minimapJumpX; focusY = camera.minimapJumpY; }
            const targetCamX = (focusX + camera.offsetX) - (canvas.width / camera.zoom) / 2;
            const targetCamY = (focusY + camera.offsetY) - (canvas.height / camera.zoom) / 2;
            camera.x += (targetCamX - camera.x) * 0.15; camera.y += (targetCamY - camera.y) * 0.15;
            camera.x = Math.max(0, Math.min(WORLD.width - (canvas.width / camera.zoom), camera.x));
            camera.y = Math.max(0, Math.min(WORLD.height - (canvas.height / camera.zoom), camera.y));

            updateLane(deltaTime); updateTowers(deltaTime); updateBot(deltaTime);

            if (bot.hp < lastBotHp - 3) bot.damageRecoilTimer = 400;
            lastBotHp = bot.hp;

            for (let i = beamTracers.length - 1; i >= 0; i--) if ((beamTracers[i].duration -= deltaTime) <= 0) beamTracers.splice(i, 1);
            for (let i = basicAtkTracers.length - 1; i >= 0; i--) if ((basicAtkTracers[i].duration -= deltaTime) <= 0) basicAtkTracers.splice(i, 1);
            for (let i = botAtkTracers.length - 1; i >= 0; i--) if ((botAtkTracers[i].duration -= deltaTime) <= 0) botAtkTracers.splice(i, 1);
            for (let i = visualExplosions.length - 1; i >= 0; i--) if ((visualExplosions[i].duration -= deltaTime) <= 0) visualExplosions.splice(i, 1);

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                const ft = floatingTexts[i];
                ft.y += ft.vy * (deltaTime / 16.67);
                ft.life -= deltaTime;
                if (ft.life <= 0) floatingTexts.splice(i, 1);
            }

            const ff = deltaTime / 16.67;
            for (let i = botProjectiles.length - 1; i >= 0; i--) {
                const bp = botProjectiles[i];
                bp.x += bp.dx * ff; bp.y += bp.dy * ff; bp.dist += Math.hypot(bp.dx * ff, bp.dy * ff);
                if (player.hp > 0 && player.state !== 'DEAD' && Math.hypot(bp.x - player.x, bp.y - player.y) < player.radius + bp.radius) {
                    if (!player.isInvincible) {
                        dealDamage(player, bp.dmg, 'bot', true);
                        visualExplosions.push({ x: bp.x, y: bp.y, radius: 40, duration: 220 });
                    }
                    botProjectiles.splice(i, 1); continue;
                }
                if (bp.dist >= bp.maxDist) botProjectiles.splice(i, 1);
            }
            for (let i = slowFields.length - 1; i >= 0; i--) {
                const f = slowFields[i]; f.duration -= deltaTime;
                const s2Dps = 18 + player.skillRanks.s2 * 12 + (player.level - 1) * 2;
                const s2TickDmg = s2Dps * (deltaTime / 1000);
                if (bot.state !== 'DEAD' && Math.hypot(bot.x - f.x, bot.y - f.y) < f.radius + bot.radius) {
                    bot.isSlowed = true; bot.slowTimer = 500;
                    dealDamage(bot, s2TickDmg, 'player', false);
                    for (let st of structures) { if (st.team === 'enemy' && st.hp > 0 && Math.hypot(player.x - st.x, player.y - st.y) <= st.range) st.currentTarget = player; }
                }
                for (let m of minions) {
                    if (m.team === 'enemy' && m.hp > 0 && Math.hypot(m.x - f.x, m.y - f.y) < f.radius + m.radius) {
                        dealDamage(m, s2TickDmg, 'player', false);
                    }
                }
                if (f.duration <= 0) slowFields.splice(i, 1);
            }
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                const prevX = p.x, prevY = p.y;
                p.x += p.dx * ff; p.y += p.dy * ff; p.distTraveled += Math.hypot(p.dx * ff, p.dy * ff);
                let stoppedByHero = false;
                const steps = 5;
                for (let s = 1; s <= steps; s++) {
                    let t = s / steps;
                    let cx = prevX + p.dx * ff * t, cy = prevY + p.dy * ff * t;
                    for (let m of minions) {
                        if (m.team === 'enemy' && m.hp > 0 && !p.hitEntities.includes(m)) {
                            if (Math.hypot(cx - m.x, cy - m.y) < m.radius + p.radius) {
                                p.hitEntities.push(m);
                                dealDamage(m, getS3Damage(true, p.chargePct), 'player', true);
                                visualExplosions.push({ x: cx, y: cy, radius: 55, duration: 260 });
                            }
                        }
                    }
                    if (bot.state !== 'DEAD' && !p.hitEntities.includes(bot) && Math.hypot(cx - bot.x, cy - bot.y) < bot.radius + p.radius) {
                        p.hitEntities.push(bot);
                        dealDamage(bot, getS3Damage(false, p.chargePct), 'player', true);
                        bot.damageRecoilTimer = 400; activatePassive();
                        visualExplosions.push({ x: cx, y: cy, radius: 60, duration: 280 });
                        for (let st of structures) { if (st.team === 'enemy' && st.hp > 0 && Math.hypot(player.x - st.x, player.y - st.y) <= st.range) st.currentTarget = player; }
                        stoppedByHero = true; break;
                    }
                    for (let st of structures) {
                        if (st.team === 'enemy' && st.hp > 0 && !p.hitEntities.includes(st) && Math.hypot(cx - st.x, cy - st.y) < st.radius + p.radius) {
                            p.hitEntities.push(st);
                            dealDamage(st, getS3Damage(false, p.chargePct) * 0.5, 'player', true);
                        }
                    }
                }
                if (stoppedByHero || p.distTraveled >= p.maxDist) projectiles.splice(i, 1);
            }

            if (player.hp <= 0 && player.state !== 'DEAD') {
                if (player.lastDamagedBy === 'bot') {
                    bot.kills += 1;
                    grantXP(bot, 180);
                    grantGold(bot, 200);
                    spawnFloatingText(player.x, player.y - 90, 'SLAIN', '#ff4560', 20);
                }
                player.deaths += 1;
                player.state = 'DEAD'; player.respawnTimer = 6000;
                player.isInvincible = false; player.passiveActive = false; player.recallTimer = 0;
                player.empoweredAtks = 0; player.empoweredTimer = 0;
                activeAim.skillId = null; document.getElementById('cancelZone').classList.remove('active', 'hovered');
                visualExplosions.push({ x: player.x, y: player.y, radius: 65, duration: 300 });
            }

            updateHUD();
            checkGameOver();
        }

        function drawFloatingTexts() {
            floatingTexts.forEach(ft => {
                const alpha = Math.min(1, (ft.life / ft.maxLife) * 2);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = `bold ${ft.size}px "Segoe UI", sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = 'rgba(0,0,0,0.85)';
                ctx.lineWidth = 3;
                ctx.strokeText(ft.text, ft.x, ft.y);
                ctx.fillStyle = ft.color;
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        function draw() {
            ctx.fillStyle = '#0d191e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

            ctx.strokeStyle = 'rgba(69, 243, 255, 0.025)'; ctx.lineWidth = 1;
            for (let x = 0; x <= WORLD.width; x += WORLD.gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height); ctx.stroke(); }
            for (let y = 0; y <= WORLD.height; y += WORLD.gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y); ctx.stroke(); }

            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(0, 150, 199, 0.14)'; ctx.lineWidth = 155;
            ctx.beginPath(); ctx.moveTo(200, 200); ctx.lineTo(2200, 2200); ctx.stroke();
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.18)'; ctx.lineWidth = 85;
            ctx.beginPath(); ctx.moveTo(200, 200); ctx.lineTo(2200, 2200); ctx.stroke();

            const drawLanePaths = () => {
                ctx.beginPath(); ctx.moveTo(400, 2000); ctx.lineTo(400, 400); ctx.lineTo(2000, 400); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(400, 2000); ctx.lineTo(2000, 2000); ctx.lineTo(2000, 400); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(400, 2000); ctx.lineTo(2000, 400); ctx.stroke();
            };
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#293d47'; ctx.lineWidth = 164; drawLanePaths();
            ctx.strokeStyle = '#162329'; ctx.lineWidth = 146; drawLanePaths();

            ctx.beginPath(); ctx.arc(400, 2000, 220, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(33, 150, 243, 0.12)'; ctx.fill();
            ctx.strokeStyle = 'rgba(33, 150, 243, 0.35)'; ctx.lineWidth = 3; ctx.stroke();
            ctx.beginPath(); ctx.arc(2000, 400, 220, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(229, 57, 53, 0.12)'; ctx.fill();
            ctx.strokeStyle = 'rgba(229, 57, 53, 0.35)'; ctx.lineWidth = 3; ctx.stroke();

            walls.forEach(w => {
                ctx.beginPath(); ctx.roundRect(w.x, w.y + 8, w.w, w.h, 16);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)'; ctx.fill();
                ctx.beginPath(); ctx.roundRect(w.x, w.y, w.w, w.h, 16);
                ctx.fillStyle = '#1f333b';
                ctx.strokeStyle = '#3d5a66';
                ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
            });

            drawNexus(allyNexus); drawNexus(enemyNexus);

            structures.forEach(t => {
                if (t.hp <= 0) return;
                const distPlayer = Math.hypot(player.x - t.x, player.y - t.y);
                const inRange = distPlayer <= t.range && t.team === 'enemy';
                const isAggro = t.team === 'enemy' && t.currentTarget === player;
                const isAggroBot = t.team === 'ally' && t.currentTarget === bot;
                if (distPlayer <= t.range + 140 || isAggro || isAggroBot) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
                    ctx.strokeStyle = (isAggro || isAggroBot) ? 'rgba(255, 23, 68, 0.85)' : (inRange ? 'rgba(255, 193, 7, 0.65)' : 'rgba(255, 255, 255, 0.16)');
                    ctx.lineWidth = (isAggro || isAggroBot) ? 3 : 1.5;
                    ctx.setLineDash((isAggro || isAggroBot) ? [] : [8, 8]); ctx.stroke(); ctx.setLineDash([]);
                }
                if (isAggro || isAggroBot) {
                    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(t.currentTarget.x, t.currentTarget.y);
                    ctx.strokeStyle = 'rgba(255, 23, 68, 0.65)'; ctx.lineWidth = 2.5;
                    ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
                }
                if (!t.isNexus) {
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                    ctx.fillStyle = t.team === 'ally' ? '#0d3a7a' : '#6a0b37';
                    ctx.strokeStyle = t.team === 'ally' ? '#2196f3' : '#ff4081';
                    ctx.lineWidth = 4; ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * 0.45, 0, Math.PI * 2);
                    ctx.fillStyle = t.team === 'ally' ? '#64b5f6' : '#ff80ab'; ctx.fill();
                    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(t.x - 42, t.y - 54, 84, 7);
                    ctx.fillStyle = t.team === 'ally' ? '#2196f3' : '#ff4081';
                    ctx.fillRect(t.x - 42, t.y - 54, 84 * (t.hp / t.maxHp), 7);
                }
            });

            slowFields.forEach(f => {
                ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(233, 69, 96, 0.22)'; ctx.strokeStyle = '#e94560'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
            });
            beamTracers.forEach(b => {
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(b.targetX, b.targetY);
                ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 4; ctx.stroke();
            });
            basicAtkTracers.forEach(b => {
                const color = b.empowered ? '#ffd54f' : 'rgba(255, 235, 59, 0.85)';
                const width = b.empowered ? 9 : 5;
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(b.target.x, b.target.y + b.offsetY);
                ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
                ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(b.target.x, b.target.y + b.offsetY);
                ctx.strokeStyle = b.empowered ? '#45f3ff' : '#ffffff'; ctx.lineWidth = b.empowered ? 3 : 1.5; ctx.stroke();
            });
            botAtkTracers.forEach(b => {
                ctx.beginPath(); ctx.moveTo(b.x1, b.y1); ctx.lineTo(b.x2, b.y2);
                ctx.strokeStyle = 'rgba(255, 65, 65, 0.85)'; ctx.lineWidth = 4; ctx.stroke();
            });
            botProjectiles.forEach(bp => {
                ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ff1744'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
            });
            projectiles.forEach(p => {
                if (p.isSniper) {
                    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                    ctx.beginPath(); ctx.rect(-50, -8, 50, 16); ctx.fillStyle = 'rgba(255, 235, 59, 0.35)';
                    ctx.shadowColor = '#ffeb3b'; ctx.shadowBlur = 20; ctx.fill();
                    ctx.beginPath(); ctx.rect(-50, -4, 50, 8); ctx.fillStyle = '#ffeb3b'; ctx.fill();
                    ctx.beginPath(); ctx.rect(-50, -1.5, 50, 3); ctx.fillStyle = '#ffffff'; ctx.fill();
                    ctx.restore();
                }
            });

            if (activeAim.skillId) {
                const iC = activeAim.isCanceled ? '#e94560' : '#45f3ff';
                const aC = activeAim.isCanceled ? 'rgba(233, 69, 96, 0.15)' : 'rgba(69, 243, 255, 0.15)';
                if (activeAim.skillId === 's2') {
                    ctx.beginPath(); ctx.arc(player.x, player.y, cooldowns.s2.range, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)'; ctx.lineWidth = 2; ctx.stroke();
                    let aX, aY;
                    if (!activeAim.hasMoved || activeAim.dragDist < 0.25) {
                        const sm = getSmartTargetCoords(cooldowns.s2.range); aX = sm.x; aY = sm.y;
                    } else {
                        const cd = activeAim.dragDist * cooldowns.s2.range;
                        aX = player.x + Math.cos(activeAim.angle) * cd; aY = player.y + Math.sin(activeAim.angle) * cd;
                    }
                    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(aX, aY);
                    ctx.strokeStyle = iC; ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
                    ctx.beginPath(); ctx.arc(aX, aY, 115, 0, Math.PI * 2);
                    ctx.fillStyle = aC; ctx.strokeStyle = iC; ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
                } else if (activeAim.skillId === 's3') {
                    const chargePct = Math.min(1.0, activeAim.chargeTime / cooldowns.s3.chargeDur);
                    const L = 400 + (chargePct * 700);
                    const ms = 0.35; const cs = ms * (1 - chargePct);
                    const aL = activeAim.angle - cs; const aR = activeAim.angle + cs;
                    ctx.lineWidth = 1.5;
                    ctx.strokeStyle = activeAim.isCanceled ? '#e94560' : 'rgba(255, 235, 59, 0.45)';
                    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + Math.cos(aL) * L, player.y + Math.sin(aL) * L); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + Math.cos(aR) * L, player.y + Math.sin(aR) * L); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(player.x + Math.cos(activeAim.angle) * L, player.y + Math.sin(activeAim.angle) * L);
                    ctx.strokeStyle = iC; ctx.lineWidth = 3; ctx.stroke();
                }
            }

            minions.forEach(m => {
                const alpha = m.spawnAlpha !== undefined ? m.spawnAlpha : 1;
                ctx.globalAlpha = alpha;
                const baseColor = m.team === 'ally' ? '#2196f3' : '#e53935';
                const strokeColor = m.team === 'ally' ? '#64b5f6' : '#ef5350';
                ctx.beginPath(); ctx.arc(m.x, m.y, m.radius, 0, Math.PI * 2);
                ctx.fillStyle = baseColor; ctx.strokeStyle = strokeColor; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
                if (m.hp < m.maxHp) {
                    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(m.x - 15, m.y - 22, 30, 4);
                    ctx.fillStyle = m.team === 'ally' ? '#64b5f6' : '#ff4141';
                    ctx.fillRect(m.x - 15, m.y - 22, 30 * (m.hp / m.maxHp), 4);
                }
                ctx.globalAlpha = 1;
            });

            if (bot.state !== 'DEAD') {
                ctx.save(); ctx.translate(bot.x, bot.y); ctx.rotate(bot.angle);
                ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(-36, -22); ctx.lineTo(-36, 22); ctx.lineTo(-10, 12);
                ctx.fillStyle = '#880e4f'; ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, bot.radius, 0, Math.PI * 2);
                ctx.fillStyle = bot.isSlowed ? '#0288d1' : '#c62828';
                ctx.strokeStyle = '#ff8a80'; ctx.lineWidth = 4; ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(10, 0, 5, 0, Math.PI * 2); ctx.fillStyle = '#00e5ff'; ctx.fill();
                ctx.restore();
                if (bot.isRecalling) {
                    const prog = bot.recallProgress / bot.recallDuration;
                    ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius + 14, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
                    ctx.strokeStyle = '#64b5f6'; ctx.lineWidth = 4; ctx.stroke();
                    ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius + 14, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(100, 181, 246, 0.25)'; ctx.lineWidth = 2; ctx.stroke();
                }
                if (bot.homeguardTimer > 0) {
                    ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius + 6, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(69, 243, 255, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
                }
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(bot.x - 35, bot.y - 46, 70, 7);
                ctx.fillStyle = '#ff1744'; ctx.fillRect(bot.x - 35, bot.y - 46, 70 * (bot.hp / bot.maxHp), 7);
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bot.x - 20, bot.y - 58, 40, 9);
                ctx.fillStyle = '#ff8a80'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`Lv.${bot.level}`, bot.x, bot.y - 50);
            }

            if (player.state !== 'DEAD') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(player.x - 30, player.y - 42, 60, 6);
                ctx.fillStyle = player.isInvincible ? '#45f3ff' : '#00ff66';
                ctx.fillRect(player.x - 30, player.y - 42, 60 * (player.hp / player.maxHp), 6);
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(player.x - 20, player.y - 54, 40, 9);
                ctx.fillStyle = '#45f3ff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(`Lv.${player.level}`, player.x, player.y - 46);
                ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
                ctx.beginPath(); ctx.moveTo(-10, -12); ctx.lineTo(-36, -22); ctx.lineTo(-36, 22); ctx.lineTo(-10, 12);
                if (player.isInvincible) ctx.fillStyle = 'rgba(69, 243, 255, 0.75)';
                else if (player.passiveActive) ctx.fillStyle = 'rgba(69, 243, 255, 0.55)';
                else ctx.fillStyle = '#ffc107';
                ctx.fill();
                ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
                if (player.isInvincible) {
                    ctx.fillStyle = 'rgba(69, 243, 255, 0.2)'; ctx.strokeStyle = '#45f3ff'; ctx.lineWidth = 4; ctx.fill(); ctx.stroke();
                } else if (player.passiveActive) {
                    ctx.fillStyle = 'rgba(69, 243, 255, 0.15)'; ctx.strokeStyle = '#45f3ff'; ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
                } else {
                    ctx.fillStyle = '#2e7d32'; ctx.strokeStyle = '#66bb6a'; ctx.lineWidth = 4; ctx.fill(); ctx.stroke();
                }
                ctx.beginPath(); ctx.arc(10, 0, 5, 0, Math.PI * 2);
                ctx.fillStyle = player.passiveActive ? 'rgba(255, 235, 59, 0.5)' : '#ffeb3b'; ctx.fill();
                ctx.restore();
                if (player.isInvincible) {
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 12, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 193, 7, 0.6)'; ctx.lineWidth = 3; ctx.stroke();
                }
                if (player.homeguardTimer > 0) {
                    const t = performance.now() * 0.002;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(69, 243, 255, ${0.4 + 0.2 * Math.sin(t * 3)})`;
                    ctx.lineWidth = 3; ctx.stroke();
                }
                if (player.empoweredAtks > 0 && player.empoweredTimer > 0) {
                    const t = performance.now() * 0.003;
                    for (let i = 0; i < player.empoweredAtks; i++) {
                        const ang = t + i * Math.PI;
                        const ox = player.x + Math.cos(ang) * (player.radius + 18);
                        const oy = player.y + Math.sin(ang) * (player.radius + 18);
                        ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffd54f';
                        ctx.shadowColor = '#45f3ff'; ctx.shadowBlur = 12;
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                }
                if (player.recallTimer > 0) {
                    const t = performance.now() * 0.001;
                    ctx.save();
                    ctx.strokeStyle = 'rgba(100, 181, 246, 0.75)'; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 18 + Math.sin(t * 1.4) * 2, 0, Math.PI * 2); ctx.stroke();
                    ctx.strokeStyle = 'rgba(100, 181, 246, 0.4)'; ctx.lineWidth = 1.5;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 28 + Math.cos(t * 1.4) * 2, 0, Math.PI * 2); ctx.stroke();
                    ctx.strokeStyle = 'rgba(100, 181, 246, 0.2)'; ctx.lineWidth = 1;
                    ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 38 + Math.sin(t * 1.2) * 3, 0, Math.PI * 2); ctx.stroke();
                    ctx.restore();
                    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(player.x - 35, player.y - 70, 70, 10);
                    ctx.fillStyle = '#64b5f6'; ctx.fillRect(player.x - 35, player.y - 70, 70 * (1 - player.recallTimer / 4000), 10);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(player.x - 35, player.y - 70, 70, 10);
                }
            }

            towerShots.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fillStyle = s.team === 'ally' ? '#42a5f5' : '#ff1744'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.fill(); ctx.stroke();
            });
            visualExplosions.forEach(exp => {
                const currentRadius = Math.max(0, exp.radius * (1.0 - exp.duration / 350));
                ctx.beginPath(); ctx.arc(exp.x, exp.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 235, 59, 0.35)'; ctx.strokeStyle = '#ffc107'; ctx.lineWidth = 3; ctx.fill(); ctx.stroke();
            });

            drawFloatingTexts();

            ctx.restore();
            drawMiniMap();
            if (player.state === 'DEAD') {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 80);
                ctx.fillStyle = '#e94560';
                ctx.font = 'bold 32px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`RESPAWNING IN ${Math.ceil(player.respawnTimer / 1000)}s`, canvas.width / 2, canvas.height / 2 + 10);
            }
        }

        function drawNexus(n) {
            ctx.save(); ctx.translate(n.x, n.y);
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const a = (Math.PI / 3) * i - Math.PI / 2;
                const x = Math.cos(a) * n.radius; const y = Math.sin(a) * n.radius;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fillStyle = n.team === 'ally' ? '#0d47a1' : '#4a0e17';
            ctx.strokeStyle = n.team === 'ally' ? '#2196f3' : '#e53935';
            ctx.lineWidth = 5; ctx.fill(); ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(-50, -n.radius - 25, 100, 8);
            ctx.fillStyle = n.team === 'ally' ? '#2196f3' : '#e53935';
            ctx.fillRect(-50, -n.radius - 25, 100 * (n.hp / n.maxHp), 8);
            ctx.restore();
        }

        function drawMiniMap() {
            const mapSize = 130; const mx = 20, my = 20;
            const scale = mapSize / WORLD.width;
            ctx.fillStyle = 'rgba(11, 12, 16, 0.88)'; ctx.strokeStyle = '#45f3ff'; ctx.lineWidth = 2;
            ctx.fillRect(mx, my, mapSize, mapSize); ctx.strokeRect(mx, my, mapSize, mapSize);

            ctx.strokeStyle = 'rgba(0, 229, 255, 0.22)'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(mx + 200 * scale, my + 200 * scale); ctx.lineTo(mx + 2200 * scale, my + 2200 * scale); ctx.stroke();

            ctx.fillStyle = '#37474f'; walls.forEach(w => ctx.fillRect(mx + w.x * scale, my + w.y * scale, w.w * scale, w.h * scale));
            ctx.fillStyle = '#2196f3'; ctx.beginPath(); ctx.arc(mx + allyNexus.x * scale, my + allyNexus.y * scale, 5, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.arc(mx + enemyNexus.x * scale, my + enemyNexus.y * scale, 5, 0, Math.PI * 2); ctx.fill();
            structures.forEach(t => {
                if (t.hp <= 0 || t.isNexus) return;
                ctx.fillStyle = t.team === 'ally' ? '#42a5f5' : '#ff4081';
                ctx.beginPath(); ctx.arc(mx + t.x * scale, my + t.y * scale, 3.5, 0, Math.PI * 2); ctx.fill();
            });
            minions.forEach(m => {
                ctx.fillStyle = m.team === 'ally' ? '#64b5f6' : '#ef5350';
                ctx.fillRect(mx + m.x * scale - 1, my + m.y * scale - 1, 2, 2);
            });
            if (bot.state !== 'DEAD') {
                ctx.fillStyle = '#ff1744'; ctx.beginPath(); ctx.arc(mx + bot.x * scale, my + bot.y * scale, 4, 0, Math.PI * 2); ctx.fill();
            }
            if (player.state !== 'DEAD') {
                ctx.fillStyle = '#00ff66'; ctx.beginPath(); ctx.arc(mx + player.x * scale, my + player.y * scale, 4, 0, Math.PI * 2); ctx.fill();
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1;
            ctx.strokeRect(mx + camera.x * scale, my + camera.y * scale, (canvas.width / camera.zoom) * scale, (canvas.height / camera.zoom) * scale);
        }

        function loop(timestamp) {
            const deltaTime = Math.min(50, timestamp - lastTime);
            lastTime = timestamp;
            update(deltaTime);
            draw();
            requestAnimationFrame(loop);
        }

        // Initialize skill UI to Lv.1 state (1 point, both S1/S2 + buttons visible)
        updateSkillUpgradeUI();

        requestAnimationFrame((timestamp) => {
            lastTime = timestamp;
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
