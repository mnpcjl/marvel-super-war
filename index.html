<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marvel Super War - Phase 10.2: Skill Upgrade Tree</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0c10">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #0b0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; color: #fff;
        }
        #gameCanvas { display: block; }
        .control-panel { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }
        .interactive { pointer-events: auto; }
        .joystick-container {
            position: absolute; bottom: 40px; left: 40px;
            width: 130px; height: 130px; background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.2); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .joystick-knob {
            width: 55px; height: 55px; background: rgba(255,255,255,0.35);
            border-radius: 50%; position: absolute;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .abilities-container {
            position: absolute; bottom: 0; right: 0;
            width: 340px; height: 270px; pointer-events: none;
        }
        .skill-btn {
            position: absolute; width: 66px; height: 66px;
            border-radius: 50%; background: #1f2833; border: 3px solid #45f3ff;
            color: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px rgba(69, 243, 255, 0.25);
            overflow: hidden; touch-action: none; pointer-events: auto;
            transition: opacity 0.2s, filter 0.2s, box-shadow 0.2s;
        }
        #s1Btn { bottom: 24px; right: 178px; }
        #s2Btn { bottom: 112px; right: 145px; }
        #s3Btn { bottom: 175px; right: 68px; width: 70px; height: 70px; }
        #atkBtn {
            bottom: 25px; right: 25px; width: 84px; height: 84px;
            border-color: #ff4560; background: #4a0e17; font-size: 14px;
        }
        .skill-btn .cd-overlay {
            position: absolute; bottom: 0; left: 0;
            width: 100%; height: 0%; background: rgba(0, 0, 0, 0.78);
            pointer-events: none;
        }
        .skill-btn .hotkey { font-size: 8px; color: #aaa; margin-top: 2px; }
        .ammo-badge {
            position: absolute; top: 4px; right: 8px; background: #ffc107;
            color: #000; font-size: 11px; font-weight: 900;
            padding: 1px 5px; border-radius: 8px; z-index: 3; box-shadow: 0 0 4px #000;
        }
        .recharge-bar {
            position: absolute; bottom: 0; left: 0; height: 4px;
            background: #ffc107; width: 0%; z-index: 3;
        }
        .mini-atk-btn {
            position: absolute; width: 44px; height: 44px;
            border-radius: 50%; background: #2a0a10; border: 2px solid #ff4560;
            color: #fff; display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; box-shadow: 0 0 8px rgba(255, 69, 96, 0.4);
            touch-action: none; pointer-events: auto; text-align: center;
        }
        #atkMinionBtn { bottom: 22px; right: 118px; }
        #atkTowerBtn  { bottom: 118px; right: 22px; }
        #recallBtn {
            position: absolute; bottom: 24px; right: 262px;
            width: 52px; height: 52px; border-radius: 50%;
            background: #0d3a7a; border: 2.5px solid #64b5f6;
            color: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 9px; font-weight: bold;
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.4);
            touch-action: none; pointer-events: auto; cursor: pointer;
        }
        #recallBtn .hotkey { font-size: 8px; color: #aaa; margin-top: 1px; }
        .cancel-zone {
            position: absolute;
            top: 16%;
            right: 34px;
            width: 58px;
            height: 58px;
            background: rgba(233, 69, 96, 0.22);
            border: 2.5px solid #e94560;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #ff6b81;
            font-size: 8px;
            letter-spacing: 0.5px;
            transform: scale(0.6);
            transition: opacity 0.18s ease-out, transform 0.18s ease-out, background 0.15s;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.25);
        }
        .cancel-zone.active { opacity: 1; transform: scale(1); }
        .cancel-zone.hovered {
            background: rgba(233, 69, 96, 0.88); color: #fff;
            border-color: #fff; transform: scale(1.18);
            box-shadow: 0 0 22px rgba(233, 69, 96, 0.85);
        }
        .hud-panel {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 12, 16, 0.92);
            padding: 6px 14px;
            border-radius: 10px;
            border: 1px solid rgba(69, 243, 255, 0.5);
            pointer-events: none;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }
        .hud-row-1 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .kills-ally { color: #45f3ff; }
        .kills-enemy { color: #ff4560; }
        .hud-timer {
            color: #fff;
            font-family: 'Courier New', monospace;
            letter-spacing: 1.5px;
            font-size: 13px;
        }
        .hud-xp-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 4px 0;
        }
        .hud-xp-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #45f3ff, #00ff66);
            transition: width 0.25s ease-out;
        }
        .hud-row-2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            color: #ccc;
            gap: 10px;
        }
        .hud-gold { color: #ffd54f; font-weight: bold; font-size: 11px; }
        .hud-level { color: #45f3ff; font-weight: bold; font-size: 11px; }
        .hud-bot { color: #ff8a80; }
        .game-over-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88); z-index: 100;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; pointer-events: auto;
        }
        .game-over-overlay.active { display: flex; }
        .game-over-overlay h1 { font-size: 56px; margin: 0 0 30px 0; letter-spacing: 4px; }
        .game-over-overlay h1.victory { color: #45f3ff; text-shadow: 0 0 24px #45f3ff; }
        .game-over-overlay h1.defeat { color: #e94560; text-shadow: 0 0 24px #e94560; }
        .restart-btn {
            background: #263238; color: #45f3ff; border: 2px solid #45f3ff;
            border-radius: 8px; padding: 14px 40px; font-size: 18px;
            cursor: pointer; font-weight: bold; letter-spacing: 2px;
        }
        .restart-btn:active { transform: scale(0.95); }

        /* Phase 10.2 - Skill Upgrade UI */
        @keyframes pulseUp {
            0% { transform: scale(0.95); box-shadow: 0 0 8px rgba(255, 213, 79, 0.7); }
            100% { transform: scale(1.1); box-shadow: 0 0 18px rgba(255, 213, 79, 1); }
        }
        .lvl-up-btn {
            position: absolute;
            width: 30px; height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd54f, #ff8f00);
            border: 2px solid #fff;
            color: #000;
            font-size: 18px; font-weight: 900; line-height: 1;
            display: none; align-items: center; justify-content: center;
            pointer-events: auto; cursor: pointer; z-index: 15;
            touch-action: none;
            animation: pulseUp 0.75s infinite alternate;
            padding: 0;
        }
        .lvl-up-btn.visible { display: flex; }
        #upS1Btn { bottom: 94px; right: 196px; }
        #upS2Btn { bottom: 182px; right: 163px; }
        #upS3Btn { bottom: 248px; right: 88px; }
        .skill-rank-label {
            font-size: 8px; color: #ffd54f; font-weight: 800; margin-top: 1px;
        }

        #orientation-warning {
            position: fixed; inset: 0; background: #0b0c10; z-index: 99999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; color: #fff; padding: 20px;
        }
        #orientation-warning h2 { color: #45f3ff; margin-bottom: 20px; font-size: 24px; }
        #orientation-warning p { color: #aaa; font-size: 16px; max-width: 300px; }
        #orientation-warning .rotate-icon {
            font-size: 48px; margin-top: 20px; transform: rotate(90deg);
            animation: spin 3s infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }
        @media (orientation: portrait) { #orientation-warning { display: flex; } }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <h2>Please Rotate Your Device</h2>
        <p>Marvel Super War requires landscape mode to play.</p>
        <div class="rotate-icon">📱</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="control-panel" id="controlPanel">
        <div class="joystick-container interactive" id="joyContainer">
            <div class="joystick-knob" id="joyKnob"></div>
        </div>

        <div class="cancel-zone" id="cancelZone">
            <span style="font-size: 18px; line-height: 1;">✕</span>
            <span>CANCEL</span>
        </div>

        <div class="abilities-container interactive">
            <button class="skill-btn" id="s1Btn"><div class="cd-overlay" id="s1CD"></div>DENSITY<span class="hotkey">[Space]</span><span class="skill-rank-label" id="s1RankText">Lv.0/4</span></button>
            <button class="skill-btn" id="s2Btn"><div class="cd-overlay" id="s2CD"></div>RADIATION<span class="hotkey">[E]</span><span class="skill-rank-label" id="s2RankText">Lv.0/5</span></button>
            <button class="skill-btn" id="s3Btn">
                <div class="cd-overlay" id="s3CD"></div>
                <div class="ammo-badge" id="s3AmmoBadge">L4</div>
                <div class="recharge-bar" id="s3RechargeBar"></div>
                SOLAR BEAM<span class="hotkey">[R]</span><span class="skill-rank-label" id="s3RankText">Lv.0/3</span>
            </button>
            <button class="skill-btn" id="atkBtn">ATK<span class="hotkey">[F]</span></button>

            <button class="lvl-up-btn" id="upS1Btn" title="Upgrade S1 [1]">+</button>
            <button class="lvl-up-btn" id="upS2Btn" title="Upgrade S2 [2]">+</button>
            <button class="lvl-up-btn" id="upS3Btn" title="Upgrade S3 [3]">+</button>
        </div>

        <button class="mini-atk-btn" id="atkMinionBtn">MINION</button>
        <button class="mini-atk-btn" id="atkTowerBtn">TOWER</button>
        <button id="recallBtn" class="interactive">RECALL<span class="hotkey">[B]</span></button>

        <div class="hud-panel" id="hudPanel">
            <div class="hud-row-1">
                <span class="kills-ally" id="allyKills">0</span>
                <span class="hud-timer" id="matchTimer">00:00</span>
                <span class="kills-enemy" id="enemyKills">0</span>
            </div>
            <div class="hud-xp-bar"><div class="hud-xp-fill" id="xpBar"></div></div>
            <div class="hud-row-2">
                <span class="hud-gold" id="goldDisplay">💰 0</span>
                <span class="hud-level" id="lvlDisplay">Lv. 1</span>
                <span class="hud-bot" id="botStateText">AI: PUSH</span>
            </div>
        </div>
    </div>

    <div class="game-over-overlay" id="gameOverOverlay">
        <h1 id="gameOverText" class="victory">VICTORY</h1>
        <button class="restart-btn" id="restartBtn">RESTART</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        const WORLD = { width: 2400, height: 2400, gridSize: 100 };
        const camera = {
            x: 0, y: 0, zoom: 1.0, offsetX: 0, offsetY: 0,
            isPanning: false, panTouchId: null,
            lastTouchX: 0, lastTouchY: 0,
            minimapJumpActive: false, minimapTouchId: null,
            minimapJumpX: 0, minimapJumpY: 0, zoomHoldTimer: 0
        };

        const player = {
            x: 400, y: 2000, radius: 22, team: 'ally', level: 1,
            baseSpeed: 3.3, speed: 3.3, angle: -Math.PI / 4, dx: 0, dy: 0,
            hp: 550, maxHp: 550, autoAtkRange: 340,
            basicAtkDmg: 10,
            xp: 0, xpToNext: 140, gold: 0, kills: 0, deaths: 0,
            isInvincible: false, invincibleTimer: 0,
            passiveActive: false, passiveTimer: 0,
            attackStunTimer: 0, attackInterval: 0, attackFacingTimer: 0,
            state: 'ALIVE', respawnTimer: 0, recallTimer: 0,
            lastDamagedBy: null,
            homeguardTimer: 0,
            empoweredAtks: 0,
            empoweredTimer: 0,
            skillPoints: 1,
            skillRanks: { s1: 0, s2: 0, s3: 0 }
        };

        const walls = [
            { x: 560,  y: 920,  w: 220, h: 80 },
            { x: 920,  y: 560,  w: 80,  h: 220 },
            { x: 580,  y: 580,  w: 180, h: 80 },
            { x: 1120, y: 720,  w: 80,  h: 220 },
            { x: 1460, y: 1120, w: 220, h: 80 },
            { x: 1640, y: 1640, w: 180, h: 80 },
            { x: 1400, y: 1620, w: 80,  h: 220 },
            { x: 1620, y: 1400, w: 220, h: 80 }
        ];

        const allyNexus  = { x: 400,  y: 2000, radius: 48, hp: 2000, maxHp: 2000, team: 'ally',  range: 310, fireCooldown: 0, fireRate: 1200, currentTarget: null, isNexus: true, rewarded: false };
        const enemyNexus = { x: 2000, y: 400,  radius: 48, hp: 2000, maxHp: 2000, team: 'enemy', range: 310, fireCooldown: 0, fireRate: 1200, currentTarget: null, isNexus: true, rewarded: false };

        const allyTopTower  = { x: 400,  y: 1100, radius: 34, range: 250, hp: 1000, maxHp: 1000, team: 'ally',  fireCooldown: 0, fireRate: 1400, currentTarget: null, rewarded: false };
        const enemyTopTower = { x: 1300, y: 400,  radius: 34, range: 250, hp: 1000, maxHp: 1000, team: 'enemy', fireCooldown: 0, fireRate: 1400, currentTarget: null, rewarded: false };
        const allyMidTower  = { x: 850,  y: 1550, radius: 34, range: 250, hp: 1000, maxHp: 1000, team: 'ally',  fireCooldown: 0, fireRate: 1400, currentTarget: null, rewarded: false };
        const enemyMidTower = { x: 1550, y: 850,  radius: 34, range: 250, hp: 1000, maxHp: 1000, team: 'enemy', fireCooldown: 0, fireRate: 1400, currentTarget: null, rewarded: false };
        const allyBotTower  = { x: 1100, y: 2000, radius: 34, range: 250, hp: 1000, maxHp: 1000, team: 'ally',  fireCooldown: 0, fireRate: 1400, currentTarget: null, rewarded: false };
        const enemyBotTower = { x: 2000, y: 1300, radius: 34, range: 250, hp: 1000, maxHp: 1000, team: 'enemy', fireCooldown: 0, fireRate: 1400, currentTarget: null, rewarded: false };
        const structures = [allyTopTower, allyMidTower, allyBotTower, enemyTopTower, enemyMidTower, enemyBotTower, allyNexus, enemyNexus];

        const minions = [];

        function generateDensePath(points, spacing) {
            const path = [];
            for (let i = 0; i < points.length - 1; i++) {
                const p1 = points[i], p2 = points[i + 1];
                const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                const steps = Math.max(1, Math.floor(dist / spacing));
                for (let j = 0; j < steps; j++) {
                    const t = j / steps;
                    path.push({ x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t });
                }
            }
            path.push(points[points.length - 1]);
            return path;
        }

        const laneManager = {
            waveTimer: 5000, waveInterval: 20000, minionCap: 24,
            spawnQueue: [],
            allyTopPath: generateDensePath([{ x: 400, y: 2000 }, { x: 400, y: 400 }, { x: 2000, y: 400 }], 40),
            allyMidPath: generateDensePath([{ x: 400, y: 2000 }, { x: 2000, y: 400 }], 40),
            allyBotPath: generateDensePath([{ x: 400, y: 2000 }, { x: 2000, y: 2000 }, { x: 2000, y: 400 }], 40),
            enemyTopPath: generateDensePath([{ x: 2000, y: 400 }, { x: 400, y: 400 }, { x: 400, y: 2000 }], 40),
            enemyMidPath: generateDensePath([{ x: 2000, y: 400 }, { x: 400, y: 2000 }], 40),
            enemyBotPath: generateDensePath([{ x: 2000, y: 400 }, { x: 2000, y: 2000 }, { x: 400, y: 2000 }], 40)
        };

        const bot = {
            x: 1920, y: 480, radius: 24, team: 'enemy', level: 1,
            baseSpeed: 2.85, speed: 2.85, angle: (3 * Math.PI) / 4,
            hp: 550, maxHp: 550, autoAtkRange: 300,
            basicAtkDmg: 10,
            xp: 0, xpToNext: 140, gold: 0, kills: 0, deaths: 0,
            attackCd: 0, attackInterval: 850, attackStunTimer: 0,
            skillCd: 2000, skillMaxCd: 5500,
            state: 'PUSHING', respawnTimer: 0,
            path: laneManager.enemyMidPath, waypointIdx: 0,
            isSlowed: false, slowTimer: 0,
            isRecalling: false, recallProgress: 0, recallDuration: 3000,
            damageRecoilTimer: 0, lastDamagedBy: null,
            homeguardTimer: 0
        };

        let lastBotHp = bot.hp;
        let matchStartTime = performance.now();
        let lastTimerSecond = -1;
        let s3ChargingPC = false;

        function createMinion(team, laneIndex, index) {
            let path;
            if (team === 'ally') {
                path = laneIndex === 0 ? laneManager.allyTopPath : laneIndex === 1 ? laneManager.allyMidPath : laneManager.allyBotPath;
            } else {
                path = laneIndex === 0 ? laneManager.enemyTopPath : laneIndex === 1 ? laneManager.enemyMidPath : laneManager.enemyBotPath;
            }
            const startIdx = 2;
            return {
                x: path[startIdx].x, y: path[startIdx].y,
                radius: 14, hp: 100, maxHp: 100,
                speed: 1.35,
                attackRange: 45, attackInterval: 900, attackCd: 0, dmg: 12,
                team: team, path: path, waypointIdx: startIdx,
                lastDamagedBy: null,
                spawnAlpha: 0
            };
        }

        function spawnMinionWave() {
            for (let lane = 0; lane < 3; lane++) {
                const allyPath = lane === 0 ? laneManager.allyTopPath : lane === 1 ? laneManager.allyMidPath : laneManager.allyBotPath;
                const enemyPath = lane === 0 ? laneManager.enemyTopPath : lane === 1 ? laneManager.enemyMidPath : laneManager.enemyBotPath;
                const allyCount = minions.filter(m => m.team === 'ally' && m.path === allyPath).length
                                + laneManager.spawnQueue.filter(q => q.team === 'ally' && q.laneIndex === lane).length;
                const enemyCount = minions.filter(m => m.team === 'enemy' && m.path === enemyPath).length
                                + laneManager.spawnQueue.filter(q => q.team === 'enemy' && q.laneIndex === lane).length;
                for (let i = 0; i < 3; i++) {
                    const delay = i * 650;
                    if (allyCount + i < laneManager.minionCap / 3) {
                        laneManager.spawnQueue.push({ delay, team: 'ally', laneIndex: lane, minionIdx: i });
                    }
                    if (enemyCount + i < laneManager.minionCap / 3) {
                        laneManager.spawnQueue.push({ delay, team: 'enemy', laneIndex: lane, minionIdx: i });
                    }
                }
            }
        }

        function processSpawnQueue(dt) {
            for (let i = laneManager.spawnQueue.length - 1; i >= 0; i--) {
                const q = laneManager.spawnQueue[i];
                q.delay -= dt;
                if (q.delay <= 0) {
                    minions.push(createMinion(q.team, q.laneIndex, q.minionIdx));
                    laneManager.spawnQueue.splice(i, 1);
                }
            }
        }

        const cooldowns = {
            s1: { max: 7000, current: 0, activeDur: 1500 },
            s2: { max: 5000, current: 0, activeDur: 3500, range: 300 },
            s3: { recastMax: 1000, current: 0, chargeDur: 900, maxChargeHoldLimit: 3000, charges: 0, maxCharges: 0, rechargeMax: 13000, rechargeTimer: 0 }
        };

        const projectiles = [];
        const botProjectiles = [];
        const towerShots = [];
        const slowFields = [];
        const beamTracers = [];
        const basicAtkTracers = [];
        const botAtkTracers = [];
        const visualExplosions = [];
        const floatingTexts = [];

        const activeAim = {
            skillId: null, touchId: null, startX: 0, startY: 0, currentX: 0, currentY: 0,
            angle: 0, dragDist: 0, chargeTime: 0, fullZoomHoldTime: 0,
            isCanceled: false, hasMoved: false
        };

        const joyContainer = document.getElementById('joyContainer');
        const joyKnob = document.getElementById('joyKnob');
        let joyActive = false, joyStartX = 0, joyStartY = 0, joyTouchId = null;
        let lastTime = performance.now();
        let gameOver = false;

        let lastHudGold = -1, lastHudLevel = -1, lastHudPlayerKills = -1, lastHudBotKills = -1, lastHudXpPct = -1;

        function spawnFloatingText(x, y, text, color, size) {
            floatingTexts.push({
                x: x + (Math.random() - 0.5) * 24,
                y: y,
                text: text, color: color, size: size,
                vy: -0.6,
                life: 900,
                maxLife: 900
            });
        }

        function dealDamage(target, amount, source, showNumber) {
            if (!target || target.hp <= 0) return;

            const isStructure = structures.includes(target);
            if (isStructure) {
                const attackerTeam = (source === 'player' || source === 'ally_minion' || source === 'ally_tower') ? 'ally' : 'enemy';
                const hasFriendlyMinion = minions.some(m =>
                    m.team === attackerTeam && m.hp > 0 &&
                    Math.hypot(m.x - target.x, m.y - target.y) <= target.range
                );
                if (!hasFriendlyMinion) {
                    amount = amount * 0.2;
                }
            }

            const actual = Math.min(amount, target.hp);
            target.hp -= amount;
            target.lastDamagedBy = source;

            if (target === player) {
                player.recallTimer = 0;
                player.homeguardTimer = 0;
            }
            if (target === bot) {
                bot.homeguardTimer = 0;
            }

                const isPlayerTookDmg = (target === player);
                const isStructureShielded = isStructure && !minions.some(m =>
                    m.team === ((source === 'player' || source === 'ally_minion' || source === 'ally_tower') ? 'ally' : 'enemy') &&
                    m.hp > 0 && Math.hypot(m.x - target.x, m.y - target.y) <= target.range
                );

                    isPlayerTookDmg ? '#ff6b81' : '#ffeb3b',
                    isPlayerTookDmg ? 15 : 14
                );

            if (target.hp <= 0 && isStructure && !target.isNexus && !target.rewarded) {

            if (entity.level >= 12) {

                spawnFloatingText(entity.x, entity.y - 50, `+${Math.round(amount)} XP`, '#45f3ff', 11);
            }
            checkLevelUp(entity);

            entity.gold += amount;

        }

        function checkLevelUp(entity) {
            while (entity.xp >= entity.xpToNext && entity.level < 12) {
                entity.xp -= entity.xpToNext;
                entity.level += 1;
                entity.maxHp += 65;
                entity.hp = Math.min(entity.maxHp, entity.hp + 65);
                entity.basicAtkDmg += 3.5;
                entity.xpToNext = 100 + entity.level * 40;

                if (entity === player) {
                    player.skillPoints += 1;
                }
                spawnFloatingText(entity.x, entity.y - 70, 'LEVEL UP!', '#00ff66', 18);
            }
            if (entity.level >= 12 && entity.xp > 0) {
                entity.gold += entity.xp * 0.6;
                entity.xp = 0;
            }
            if (entity === player) updateSkillUpgradeUI();
        }

        function canUpgradeSkill(sk) {
            if (player.skillPoints <= 0) return false;
            const r = player.skillRanks[sk];
            if (sk === 's3') {
                if (r === 0 && player.level >= 4) return true;
                if (r === 1 && player.level >= 8) return true;
                if (r === 2 && player.level >= 12) return true;
                return false;
            } else {
                const maxCap = (sk === 's2') ? 5 : 4;
                const maxAllowed = Math.min(maxCap, Math.ceil(player.level / 2));
                return r < maxAllowed;
            }
        }

        function upgradeSkill(sk) {
            if (!canUpgradeSkill(sk)) return;
            player.skillPoints -= 1;
            player.skillRanks[sk] += 1;
            const rank = player.skillRanks[sk];

            if (sk === 's1') {
                cooldowns.s1.max = 7000 - (rank - 1) * 700;
            } else if (sk === 's2') {
                cooldowns.s2.max = 5000 - (rank - 1) * 350;
            } else if (sk === 's3') {
                if (rank === 1) {
                    cooldowns.s3.maxCharges = 2;

                    e.preventDefault();

                    camera.minimapTouchId = touch.identifier;
                    resolveMinimapPan(x, y);
                    continue;
                }
                const targetEl = touch.target;
                if (targetEl.closest('.joystick-container') || targetEl.closest('.abilities-container') ||
                    targetEl.closest('.hud-panel') || targetEl.closest('.mini-atk-btn') || targetEl.closest('#recallBtn')) continue;
                if (!camera.isPanning) {

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                if (camera.minimapJumpActive && touch.identifier === camera.minimapTouchId) resolveMinimapPan(touch.clientX, touch.clientY);
                if (joyActive && touch.identifier === joyTouchId) {
                    const dx = touch.clientX - joyStartX;
                    const dy = touch.clientY - joyStartY;
                    const dist = Math.hypot(dx, dy);
                    const maxDist = 45;
                    const angle = Math.atan2(dy, dx);
                    if (activeAim.skillId !== 's3' && player.attackFacingTimer <= 0) player.angle = angle;
                    if (dist < maxDist) {
                        joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
                        player.dx = Math.cos(angle) * (dist / maxDist);
                        player.dy = Math.sin(angle) * (dist / maxDist);
                    } else {
                        joyKnob.style.transform = `translate(${Math.cos(angle) * maxDist}px, ${Math.sin(angle) * maxDist}px)`;
                        player.dx = Math.cos(angle); player.dy = Math.sin(angle);

                }
                if (activeAim.skillId && touch.identifier === activeAim.touchId) {
                    activeAim.currentX = touch.clientX;
                    activeAim.currentY = touch.clientY;
                    const dx = activeAim.currentX - activeAim.startX;
                    const dy = activeAim.currentY - activeAim.startY;
                    if (Math.hypot(dx, dy) > 12) activeAim.hasMoved = true;
                    if (Math.hypot(dx, dy) > 8) {

                    activeAim.dragDist = Math.min(1.0, Math.hypot(dx, dy) / 60);

                        activeAim.isCanceled = false;
                        cancelEl.classList.remove('hovered');

                    e.preventDefault();
                    const dx = touch.clientX - camera.lastTouchX;
                    const dy = touch.clientY - camera.lastTouchY;
                    let maxPan = 450;

                    camera.lastTouchX = touch.clientX; camera.lastTouchY = touch.clientY;

        function getSmartTargetCoords(maxRange) {
            let best = null, bestDist = Infinity;
            if (bot.state !== 'DEAD' && bot.hp > 0) {
                const dBot = Math.hypot(bot.x - player.x, bot.y - player.y);
                if (dBot <= maxRange + bot.radius) { best = bot; bestDist = dBot; }
            }
            if (!best) {
                for (let m of minions) {
                    if (m.team === 'enemy' && m.hp > 0) {
                        const d = Math.hypot(m.x - player.x, m.y - player.y);
                        if (d <= maxRange && d < bestDist) { best = m; bestDist = d; }
                    }
                }
            }
            if (best) return { x: best.x, y: best.y, angle: Math.atan2(best.y - player.y, best.x - player.x) };
            return { x: player.x + Math.cos(player.angle) * (maxRange * 0.75), y: player.y + Math.sin(player.angle) * (maxRange * 0.75), angle: player.angle };
        }

        function checkWallCollision(cx, cy, radius, rect) {
            const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
            const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
            const dx = cx - closestX, dy = cy - closestY;
            return (dx * dx + dy * dy) < (radius * radius);
        }
        function isInsideAnyWall(cx, cy, radius) {
            for (let w of walls) if (checkWallCollision(cx, cy, radius, w)) return w;
            return null;
        }
        function ejectFromWall(p) {
            const wall = isInsideAnyWall(p.x, p.y, p.radius);
            if (!wall) return;
            const distLeft = (p.x - wall.x) + p.radius;
            const distRight = ((wall.x + wall.w) - p.x) + p.radius;
            const distTop = (p.y - wall.y) + p.radius;
            const distBottom = ((wall.y + wall.h) - p.y) + p.radius;
            const minDist = Math.min(distLeft, distRight, distTop, distBottom);
            if (minDist === distLeft) p.x = wall.x - p.radius - 2;
            else if (minDist === distRight) p.x = wall.x + wall.w + p.radius + 2;
            else if (minDist === distTop) p.y = wall.y - p.radius - 2;
            else p.y = wall.y + wall.h + p.radius + 2;
        }
        function canMoveTo(newX, newY, radius, ignoreWalls) {
            if (newX < radius || newX > WORLD.width - radius || newY < radius || newY > WORLD.height - radius) return false;
            return ignoreWalls ? true : !isInsideAnyWall(newX, newY, radius);
        }
